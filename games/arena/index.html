<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Неон-арена</title>
<link rel="stylesheet" href="../shared/game.css">
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span id="score">0</span><span id="wave" class="muted"></span><span id="hp"></span><span id="power" class="muted"></span></div>
<div class="overlay" id="menu">
  <h1>Неон-арена</h1>
  <p>Выживи как можно дольше. Стреляй во врагов, собирай бонусы, не дай себя окружить.</p>
  <p class="keys" id="howto"></p>
  <button id="play">Играть</button>
  <p id="best"></p>
</div>
<script src="../shared/pad.js"></script>
<script>
'use strict';
const cv = document.getElementById('c');
const g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

Pad.init({
  left: true, right: true,
  buttons: [{ id: 'bomb', label: '💣', keys: ['Space', 'KeyE'], gp: [0, 5], small: true }, { id: 'pause', keys: ['Escape', 'KeyP'], gp: [9], touch: false }],
  keys: {
    lx: [['KeyA'], ['KeyD']], ly: [['KeyW'], ['KeyS']],
    rx: [['ArrowLeft'], ['ArrowRight']], ry: [['ArrowUp'], ['ArrowDown']],
  },
});
document.getElementById('howto').textContent = Pad.isTouch
  ? 'Левый палец — двигаться, правый — целиться и стрелять.'
  : 'WASD — двигаться, мышь или стрелки — стрелять. Геймпад: стики. Пробел / RB — бомба.';

// Мышь: целимся туда, где курсор, стреляем при нажатии.
const mouse = { x: 0, y: 0, down: false, used: false };
addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.used = true; });
addEventListener('mousedown', (e) => { if (e.button === 0) mouse.down = true; mouse.used = true; });
addEventListener('mouseup', () => { mouse.down = false; });

let state = 'menu';
let p, bullets, enemies, parts, pickups, score, wave, waveTimer, spawnLeft, shake, bombs, t;

function reset() {
  p = { x: W / 2, y: H / 2, r: 14, hp: 5, inv: 0, cd: 0, triple: 0, rapid: 0, shield: 0 };
  bullets = []; enemies = []; parts = []; pickups = [];
  score = 0; wave = 0; waveTimer = 1; spawnLeft = 0; shake = 0; bombs = 1; t = 0;
}

const TYPES = {
  chaser: { r: 13, hp: 1, speed: 95, color: '#f472b6', pts: 10 },
  runner: { r: 9, hp: 1, speed: 190, color: '#facc15', pts: 15 },
  tank: { r: 24, hp: 7, speed: 55, color: '#a78bfa', pts: 50 },
  splitter: { r: 18, hp: 3, speed: 80, color: '#34d399', pts: 30 },
  mini: { r: 8, hp: 1, speed: 150, color: '#34d399', pts: 5 },
};

function spawn(type, x, y) {
  const T = TYPES[type];
  if (x === undefined) {
    const side = Math.floor(Math.random() * 4);
    x = side === 0 ? -30 : side === 1 ? W + 30 : Math.random() * W;
    y = side === 2 ? -30 : side === 3 ? H + 30 : Math.random() * H;
    if (side < 2) y = Math.random() * H;
  }
  enemies.push({ type, x, y, r: T.r, hp: T.hp + Math.floor(wave / 6) * (type === 'tank' ? 2 : 0), speed: T.speed * (1 + wave * 0.03), color: T.color, pts: T.pts, vx: 0, vy: 0, flash: 0, wob: Math.random() * 6 });
}

function nextWave() {
  wave++;
  spawnLeft = 6 + wave * 3;
  waveTimer = 0;
  if (wave > 1 && wave % 3 === 0) bombs = Math.min(3, bombs + 1);
  banner = { text: 'Волна ' + wave, t: 2 };
  Sfx.tone(300, 0.3, 'sawtooth', 0.06, 900);
}
let banner = null;

function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (0.3 + Math.random()) * (speed || 220);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.5, max: 0.9, color });
  }
}

function bomb() {
  if (bombs <= 0) return;
  bombs--;
  shake = 18;
  Sfx.noise(0.6, 0.25);
  for (const e of enemies) { e.hp = 0; }
  burst(p.x, p.y, '#ffffff', 80, 600);
}

function hurt() {
  if (p.inv > 0) return;
  if (p.shield > 0) { p.shield = 0; p.inv = 1; Sfx.tone(800, 0.2, 'sine', 0.08, 200); return; }
  p.hp--; p.inv = 1.5; shake = 14;
  Sfx.noise(0.3, 0.2);
  burst(p.x, p.y, '#6ee7ff', 30);
  if (p.hp <= 0) gameOver();
}

function gameOver() {
  state = 'over';
  Best.set('arena', score);
  Sfx.tone(400, 0.8, 'sawtooth', 0.08, 50);
  const m = document.getElementById('menu');
  m.querySelector('h1').textContent = 'Игра окончена';
  m.querySelector('p').innerHTML = `<span class="big">${score} очков</span><br>Волна ${wave}`;
  document.getElementById('play').textContent = 'Ещё раз';
  showBest();
  setTimeout(() => m.classList.remove('hidden'), 700);
}

function showBest() { document.getElementById('best').textContent = Best.get('arena') ? 'Рекорд: ' + Best.get('arena') : ''; }
showBest();

document.getElementById('play').onclick = () => {
  reset(); state = 'play';
  document.getElementById('menu').classList.add('hidden');
  mouse.down = false;
};

function update(dt) {
  Pad.update();
  if (state === 'play' && Pad.pressed('pause')) { state = 'pause'; banner = { text: 'Пауза', t: 1e9 }; return; }
  if (state === 'pause') { if (Pad.pressed('pause') || Pad.pressed('bomb')) { state = 'play'; banner = null; } return; }
  if (state !== 'play') {
    if (Pad.pressed('bomb') && !document.getElementById('menu').classList.contains('hidden')) document.getElementById('play').click();
    return;
  }
  t += dt;

  // Игрок
  const mx = Pad.axis('lx'), my = Pad.axis('ly');
  p.x = Math.max(p.r, Math.min(W - p.r, p.x + mx * 260 * dt));
  p.y = Math.max(p.r, Math.min(H - p.r, p.y + my * 260 * dt));
  p.inv = Math.max(0, p.inv - dt);
  p.triple = Math.max(0, p.triple - dt);
  p.rapid = Math.max(0, p.rapid - dt);
  p.cd -= dt;

  let ax = Pad.axis('rx'), ay = Pad.axis('ry');
  let firing = Math.hypot(ax, ay) > 0.3;
  if (!firing && mouse.used && mouse.down && Pad.source() === 'keyboard') {
    ax = mouse.x - p.x; ay = mouse.y - p.y; firing = true;
  }
  if (firing) p.aim = Math.atan2(ay, ax);
  if (firing && p.cd <= 0) {
    p.cd = p.rapid > 0 ? 0.07 : 0.14;
    const spread = p.triple > 0 ? [-0.18, 0, 0.18] : [0];
    for (const s of spread) {
      const a = p.aim + s + (Math.random() - 0.5) * 0.04;
      bullets.push({ x: p.x + Math.cos(a) * 16, y: p.y + Math.sin(a) * 16, vx: Math.cos(a) * 720, vy: Math.sin(a) * 720, life: 1.2 });
    }
    Sfx.tone(880 + Math.random() * 120, 0.05, 'square', 0.025, 440);
  }
  if (Pad.pressed('bomb')) bomb();

  // Волны
  if (spawnLeft <= 0 && enemies.length === 0) { waveTimer += dt; if (waveTimer > 1.2) nextWave(); }
  if (spawnLeft > 0) {
    waveTimer += dt;
    const every = Math.max(0.18, 0.7 - wave * 0.04);
    while (waveTimer > every && spawnLeft > 0) {
      waveTimer -= every; spawnLeft--;
      const r = Math.random();
      const type = wave >= 4 && r < 0.12 ? 'tank' : wave >= 3 && r < 0.3 ? 'splitter' : wave >= 2 && r < 0.5 ? 'runner' : 'chaser';
      spawn(type);
    }
  }

  // Пули
  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; }
  bullets = bullets.filter((b) => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

  // Враги
  for (const e of enemies) {
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.wob += dt * 4;
    let tx = dx / d, ty = dy / d;
    if (e.type === 'runner') { tx += Math.cos(e.wob) * 0.6; ty += Math.sin(e.wob) * 0.6; }
    e.vx += (tx * e.speed - e.vx) * Math.min(1, dt * 3);
    e.vy += (ty * e.speed - e.vy) * Math.min(1, dt * 3);
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.flash = Math.max(0, e.flash - dt);
    if (d < e.r + p.r - 3) hurt();
    for (const b of bullets) {
      if (b.life > 0 && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
        b.life = 0; e.hp--; e.flash = 0.08;
        e.vx -= b.vx * 0.05; e.vy -= b.vy * 0.05;
        burst(b.x, b.y, e.color, 3, 120);
      }
    }
  }
  // Враги не слипаются
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
    if (d > 0 && d < m) { const k = (m - d) / d / 2; a.x -= dx * k; a.y -= dy * k; b.x += dx * k; b.y += dy * k; }
  }
  const alive = [];
  for (const e of enemies) {
    if (e.hp > 0) { alive.push(e); continue; }
    score += e.pts;
    burst(e.x, e.y, e.color, e.r > 20 ? 40 : 16);
    Sfx.noise(0.12, 0.08);
    if (e.type === 'splitter') for (let k = 0; k < 3; k++) { spawn('mini', e.x + (Math.random() - 0.5) * 20, e.y + (Math.random() - 0.5) * 20); }
    if (Math.random() < (e.type === 'tank' ? 0.6 : 0.05)) {
      const kinds = ['triple', 'rapid', 'shield', 'heart'];
      pickups.push({ x: e.x, y: e.y, kind: kinds[Math.floor(Math.random() * kinds.length)], life: 9 });
    }
  }
  enemies = alive;

  // Бонусы
  for (const k of pickups) {
    k.life -= dt;
    if (Math.hypot(k.x - p.x, k.y - p.y) < 26) {
      k.life = 0;
      Sfx.tone(600, 0.15, 'sine', 0.08, 1400);
      if (k.kind === 'triple') p.triple = 10;
      if (k.kind === 'rapid') p.rapid = 8;
      if (k.kind === 'shield') p.shield = 1;
      if (k.kind === 'heart') p.hp = Math.min(6, p.hp + 1);
    }
  }
  pickups = pickups.filter((k) => k.life > 0);

  for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.94; q.vy *= 0.94; q.life -= dt; }
  parts = parts.filter((q) => q.life > 0);
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  shake = Math.max(0, shake - dt * 40);
}

const ICON = { triple: '⫶', rapid: '⚡', shield: '◎', heart: '♥' };
const PCOL = { triple: '#6ee7ff', rapid: '#facc15', shield: '#a78bfa', heart: '#f87171' };

function draw() {
  g.save();
  g.fillStyle = 'rgba(5,7,15,0.35)';
  g.fillRect(0, 0, W, H);
  if (shake) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // сетка
  g.strokeStyle = '#6ee7ff10'; g.lineWidth = 1;
  g.beginPath();
  for (let x = 0; x < W; x += 48) { g.moveTo(x, 0); g.lineTo(x, H); }
  for (let y = 0; y < H; y += 48) { g.moveTo(0, y); g.lineTo(W, y); }
  g.stroke();

  g.globalCompositeOperation = 'lighter';
  for (const q of parts) { g.fillStyle = q.color; g.globalAlpha = Math.max(0, q.life / q.max); g.fillRect(q.x - 2, q.y - 2, 4, 4); }
  g.globalAlpha = 1;
  g.fillStyle = '#e0faff';
  g.shadowBlur = 12; g.shadowColor = '#6ee7ff';
  for (const b of bullets) { g.beginPath(); g.arc(b.x, b.y, 3.5, 0, 7); g.fill(); }
  for (const e of enemies) {
    g.shadowColor = e.color; g.strokeStyle = e.flash ? '#fff' : e.color; g.lineWidth = 3;
    g.beginPath();
    const sides = e.type === 'tank' ? 6 : e.type === 'runner' ? 3 : e.type === 'splitter' || e.type === 'mini' ? 5 : 4;
    for (let i = 0; i <= sides; i++) {
      const a = e.wob * (e.type === 'chaser' ? 0.5 : 0.2) + (i / sides) * Math.PI * 2;
      g[i ? 'lineTo' : 'moveTo'](e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r);
    }
    g.stroke();
  }
  for (const k of pickups) {
    if (k.life < 2 && Math.floor(k.life * 8) % 2) continue;
    g.shadowColor = PCOL[k.kind]; g.fillStyle = PCOL[k.kind];
    g.font = 'bold 22px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ICON[k.kind], k.x, k.y + Math.sin(t * 5) * 3);
  }
  if (state !== 'menu' && p && (p.inv <= 0 || Math.floor(p.inv * 12) % 2)) {
    g.shadowColor = '#6ee7ff'; g.strokeStyle = '#6ee7ff'; g.lineWidth = 3;
    g.save(); g.translate(p.x, p.y); g.rotate(p.aim || 0);
    g.beginPath(); g.moveTo(18, 0); g.lineTo(-12, 11); g.lineTo(-6, 0); g.lineTo(-12, -11); g.closePath(); g.stroke();
    g.restore();
    if (p.shield) { g.strokeStyle = '#a78bfa'; g.beginPath(); g.arc(p.x, p.y, 24, 0, 7); g.stroke(); }
  }
  g.restore();
  g.shadowBlur = 0;
  if (banner) {
    g.globalAlpha = Math.min(1, banner.t);
    g.fillStyle = '#fff'; g.font = '800 44px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(banner.text, W / 2, H * 0.3);
    g.globalAlpha = 1;
  }
  if (p) {
    document.getElementById('score').textContent = score;
    document.getElementById('wave').textContent = wave ? 'Волна ' + wave : '';
    document.getElementById('hp').textContent = '♥'.repeat(Math.max(0, p.hp)) + (p.shield ? ' ◎' : '');
    document.getElementById('power').textContent = (p.triple > 0 ? '⫶ ' : '') + (p.rapid > 0 ? '⚡ ' : '') + '💣'.repeat(bombs);
  }
}

reset();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
